name: Deploy Lambda (Terraform)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::248189908610:role/GithubOIDCRole
          aws-region: us-east-1

      - name: Ensure Terraform state S3 bucket
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -e
          # create S3 bucket if it does not exist
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "Creating S3 bucket $TF_STATE_BUCKET"
            if [ "${AWS_REGION}" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$TF_STATE_BUCKET"
            else
              aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --create-bucket-configuration LocationConstraint=${AWS_REGION}
            fi
            aws s3api put-bucket-versioning --bucket "$TF_STATE_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$TF_STATE_BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          else
            echo "S3 bucket exists: $TF_STATE_BUCKET"
          fi

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Python deps for layer
        run: |
          python -m pip install --upgrade pip
          rm -rf layer_build
          mkdir -p layer_build/python/lib/python3.12/site-packages
          pip install -r requirements.txt -t layer_build/python/lib/python3.12/site-packages

      - name: Prepare Lambda layer package
        run: |
          rm -f layer_package.zip
          pushd layer_build
          zip -r ../layer_package.zip . > /dev/null
          popd
          ls -lh layer_package.zip

      - name: Install Python deps into build_dir (if you need any runtime-only local files)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -t build_dir || true

      - name: Prepare deployment package (code only)
        run: |
          rm -rf build
          mkdir -p build
          if [ -d build_dir ]; then cp -r build_dir/* build/ || true; fi
          mkdir -p build/src
          cp -r src/* build/src/
          # Remove large libs that are included in layer to avoid duplication
          # (optional) e.g. rm -rf build/src/.venv
          pushd build
          zip -r ../deployment_package.zip . > /dev/null
          popd
          ls -lh deployment_package.zip

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.7"

      - name: Terraform Init
        working-directory: terraform
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: terraform init -input=false \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="key=${{ secrets.TF_STATE_KEY }}" \
          -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Apply
        working-directory: terraform
        env:
          TF_VAR_google_api_key: ${{ secrets.GOOGLE_API_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: terraform apply -auto-approve -input=false