AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: YouTube Video Summarizer Lambda Function
Resources:
  YouTubeSummarizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handler.lambda_handler
      Runtime: python3.12
      CodeUri: YouTubeSummarizerFunction
      MemorySize: 128
      Timeout: 30
      Policies:
      - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          GOOGLE_API_KEY:
            Ref: GoogleApiKey
      Events:
        Api:
          Type: Api
          Properties:
            Path: /summarize
            Method: post
    Metadata:
      SamResourceId: YouTubeSummarizerFunction
Parameters:
  GoogleApiKey:
    Type: String
    Description: Your Google API Key for accessing the Generative AI model.
